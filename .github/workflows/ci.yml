
name: Full CI
on:
  push:
    branches:
      - main
      - dev
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python_snippets:
    name: Check Python snippets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"

      - name: Install Python deps
        run: uv sync --all-extras

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Install Node deps
        run: pnpm install --frozen-lockfile

      - name: Check Python snippets
        run: pnpm run test:python-snippets

  docs_build:
    name: Build docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm run build:ci

  doc_tests:
    name: Test and update notebooks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: docs_build
    environment: docs-deploy
    permissions:
      contents: read # checkout
      pull-requests: read # list PR files via the gh api call below
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Notebook execution is slow and needs provider API keys, so only run it
      # when the PR actually touches notebooks or the notebook test harness.
      # Pushes to main/dev always run (OVERWRITE_NB depends on it).
      - name: Detect notebook-relevant changes
        id: nbchanges
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename')
          if echo "$files" | grep -Eq '\.ipynb$|^tests/(conftest|test_docs_nb)\.py$|^pyproject\.toml$|^uv\.lock$|^\.github/workflows/ci\.yml$|^scripts/convert-notebooks\.mjs$'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install uv
        if: steps.nbchanges.outputs.relevant == 'true'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"

      - name: Install Python deps
        if: steps.nbchanges.outputs.relevant == 'true'
        run: uv sync --all-extras

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          cache: "pnpm"

      - name: Install Node deps
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm run build:ci

      - name: Check MDX tables render
        run: pnpm run test:tables

      - name: Check redirects
        run: pnpm run test:redirects

      - name: Run notebook tests
        if: steps.nbchanges.outputs.relevant == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.AZURE_AI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.AZURE_AI_API_BASE }}
          OVERWRITE_NB: ${{ github.ref == 'refs/heads/main' && '1' || '0' }}
        run: uv run pytest tests/test_docs_nb.py -v --tb=short

      - name: Regenerate .mdx from updated notebooks (main only)
        if: github.ref == 'refs/heads/main'
        run: node scripts/convert-notebooks.mjs

      - name: Generate app token (main only)
        if: github.ref == 'refs/heads/main'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Commit updated notebooks and docs (main only)
        if: github.ref == 'refs/heads/main'
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/docs/oss/checks/
          if ! git diff --staged --quiet; then
            git commit -m "chore: update notebook outputs and regenerate mdx [skip ci]"
            git remote set-url origin "https://x-access-token:${APP_TOKEN}@github.com/${REPO}.git"
            git push
          fi
