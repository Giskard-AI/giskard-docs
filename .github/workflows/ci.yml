
name: Full CI
on:
  push:
    branches:
      - main
      - dev
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python_snippets:
    name: Check Python snippets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
          enable-cache: false

      - name: Install Python deps
        run: uv sync --all-extras

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          package-manager-cache: false

      - name: Install Node deps
        run: pnpm install --frozen-lockfile

      - name: Check Python snippets
        run: pnpm run test:python-snippets

      - name: Check API baselines
        run: uv run pytest tests/test_docs_refresh.py

  docs_build:
    name: Build docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm run build:ci

  doc_tests:
    name: Test and update notebooks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: docs_build
    environment: docs-deploy
    permissions:
      contents: read # checkout
      pull-requests: write # list PR files and upsert the sticky SEO report comment
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Notebook execution is slow and needs provider API keys, so only run it
      # when the PR actually touches notebooks or the notebook test harness.
      # Pushes to main/dev always run (OVERWRITE_NB depends on it).
      - name: Detect notebook-relevant changes
        id: nbchanges
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename')
          if echo "$files" | grep -Eq '\.ipynb$|^tests/(conftest|test_docs_nb)\.py$|^pyproject\.toml$|^uv\.lock$|^\.github/workflows/ci\.yml$|^scripts/convert-notebooks\.mjs$'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install uv
        if: steps.nbchanges.outputs.relevant == 'true'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
          enable-cache: false

      - name: Install Python deps
        if: steps.nbchanges.outputs.relevant == 'true'
        run: uv sync --all-extras

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.2"
          package-manager-cache: false

      - name: Install Node deps
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm run build:ci

      - name: Check MDX tables render
        run: pnpm run test:tables

      - name: Check redirects
        run: pnpm run test:redirects

      - name: Check SEO invariants
        run: pnpm run test:seo

      - name: Report SEO metadata guidance
        run: pnpm --silent run report:seo | tee seo-report.md

      # Same-repo PRs only: fork PRs get a read-only token and cannot comment.
      - name: Post SEO report as sticky PR comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash scripts/post-sticky-comment.sh seo-metadata-advisory seo-report.md

      - name: Run notebook tests
        if: steps.nbchanges.outputs.relevant == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.AZURE_AI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.AZURE_AI_API_BASE }}
          OVERWRITE_NB: ${{ github.ref == 'refs/heads/main' && '1' || '0' }}
        run: uv run pytest tests/test_docs_nb.py -v --tb=short

      # On push to main the notebook tests overwrite the .ipynb outputs
      # (OVERWRITE_NB=1). Hand them to the docs_release job as an artifact:
      # this job holds the provider keys but no write credential.
      - name: Upload regenerated notebooks (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: regenerated-notebooks
          path: src/content/docs/oss/checks/**/*.ipynb
          if-no-files-found: error
          retention-days: 1

  # The only job that can reach the release App private key. It runs on push to
  # main only and uses the `docs-release` environment, whose deployment branch
  # policy is restricted to `main`. It never runs on pull_request.
  docs_release:
    name: Commit regenerated notebooks to main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: doc_tests
    environment: docs-release
    permissions:
      contents: read # checkout; the push uses the release App token
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download regenerated notebooks
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: regenerated-notebooks
          path: ${{ runner.temp }}/regenerated-notebooks

      # The artifact is not trusted: copy only regular .ipynb files into the
      # expected directory. `find -type f` skips symlinks and never yields `..`.
      - name: Stage regenerated notebooks
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/regenerated-notebooks
          NOTEBOOKS_DIR: src/content/docs/oss/checks
        run: |
          set -euo pipefail
          cd "$ARTIFACT_DIR"
          find . -type f -name '*.ipynb' -print0 | while IFS= read -r -d '' file; do
            dest="$GITHUB_WORKSPACE/$NOTEBOOKS_DIR/${file#./}"
            mkdir -p "$(dirname "$dest")"
            cp -- "$file" "$dest"
          done

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.2"
          package-manager-cache: false

      - name: Regenerate .mdx from updated notebooks
        run: node scripts/convert-notebooks.mjs

      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Commit updated notebooks and docs
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/docs/oss/checks/
          if ! git diff --staged --quiet; then
            git commit -m "chore: update notebook outputs and regenerate mdx [skip ci]"
            git remote set-url origin "https://x-access-token:${APP_TOKEN}@github.com/${REPO}.git"
            git push
          fi
