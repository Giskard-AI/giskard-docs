overrides:
  dompurify: "^3.4.17"

# Supply-chain cooldown: resolve only versions published at least 7 days ago
# (in minutes), like Renovate's minimumReleaseAge for the other dependencies.
minimumReleaseAge: 10080

supportedArchitectures:
  cpu:
    - current
    - wasm32

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
minimumReleaseAgeExclude:
  # Renovate security update: astro@7.4.7
  - astro@7.4.7
